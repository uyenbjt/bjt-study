<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BJT Study v2.0</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

</head>

<body>

<div class="container">

<h1>BJT Study v2.0</h1>

<div class="toolbar">

<select id="sectionFilter">
<option value="">📂 Tất cả Section</option>
</select>

<select id="questionTypeFilter">
<option value="">📚 Tất cả QuestionType</option>
</select>

<select id="categoryFilter">
<option value="">🏷 Tất cả Chủ đề</option>
</select>

<button id="shuffleBtn">🔀 Shuffle</button>

<button id="wrongBtn">❌ Ôn câu sai</button>

<button id="resetBtn">🔄 Reset</button>

</div>

<div class="toolbar">

<label>

<input type="checkbox" id="timerToggle">

Timer

</label>

<span id="timer"></span>

<button id="speakBtn">🔊 Speak</button>

<button id="pauseBtn">⏸ Pause</button>

<button id="resumeBtn">▶ Resume</button>

<button id="stopBtn">⏹ Stop</button>

<select id="speedSelect">

<option value="0.75">0.75x</option>

<option value="0.9">0.9x</option>

<option value="1" selected>1.0x</option>

<option value="1.15">1.15x</option>

<option value="1.3">1.3x</option>

</select>

</div>

<div id="stats"></div>

<div id="counter"></div>

<div id="question"></div>

<div id="answers"></div>

<div id="result"></div>

<div id="detail"></div>

<div class="nav">

<button id="prevBtn">⬅ Trước</button>

<button id="nextBtn">Tiếp ➡</button>

</div>

</div>

<script src="storage.js"></script>

<script src="stats.js"></script>

<script src="data.js"></script>

<script src="filter.js"></script>

<script src="render.js"></script>

<script src="audio.js"></script>

<script src="timer.js"></script>

<script src="script.js"></script>

</body>

</html>
